<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Merkliste</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { background: #0b0e14; color: #e6e9f0; font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 28px 16px; }
  h1 { text-align: center; font-size: 22px; margin: 0 0 4px; }
  .count { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 14px; }
  .search-wrap { max-width: 420px; margin: 0 auto 20px; }
  .search-input { width: 100%; background: #12161f; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 9px 12px; color: #e6e9f0; font-size: 14px; }
  .search-input:focus { outline: none; border-color: rgba(59,130,246,0.5); }
  .search-input::placeholder { color: #64748b; }
  .no-results { display: none; text-align: center; color: #64748b; font-size: 13px; margin-top: 20px; }
  .no-results.show { display: block; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; max-width: 1300px; margin: 0 auto; }
  .card { background: #12161f; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; cursor: pointer; transition: transform 0.15s, border-color 0.15s; }
  .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: rgba(255,255,255,0.2); outline: none; }
  .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #1a2030; }
  .no-poster { width: 100%; aspect-ratio: 2/3; background: #1a2030; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .info { padding: 6px 7px 7px; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .info h2 { font-size: 11px; margin: 0; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { color: #94a3b8; font-size: 9.5px; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .overlay.open { display: flex; }
  .detail { background: #12161f; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; max-width: 480px; width: 100%; max-height: 88vh; overflow-y: auto; position: relative; }
  .detail-close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,0.5); color: #fff; border: none; font-size: 16px; cursor: pointer; z-index: 1; }
  .detail img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #1a2030; border-radius: 16px 16px 0 0; }
  .detail-body { padding: 16px 18px 20px; }
  .detail-body h2 { font-size: 18px; margin: 0 0 4px; }
  .detail-meta { color: #94a3b8; font-size: 13px; margin-bottom: 10px; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
  .badge { background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.25); color: #93c5fd; border-radius: 20px; padding: 3px 10px; font-size: 11.5px; font-weight: 500; }
  .detail-overview { color: #cbd5e1; font-size: 13.5px; line-height: 1.55; margin: 0; }
</style>
</head>
<body>
<h1>Merkliste</h1>
<div class="count" id="count">4 gemerkte Filme &middot; Stand: 02.10.2026 14:27</div>
<div class="search-wrap">
  <input type="text" id="search" class="search-input" placeholder="Merkliste durchsuchen …" autocomplete="off">
</div>
<div class="grid" id="grid">
      <div class="card" data-index="0" tabindex="0" role="button" aria-label="Details zu Der Astronaut – Project Hail Mary">
        <img src="https://image.tmdb.org/t/p/w500/qUraey7aJVaqx6NhlXl5Q7Z1rEX.jpg" alt="" loading="lazy">
        <div class="info">
          <h2>Der Astronaut – Project Hail Mary</h2>
          <div class="meta">2026</div>
        </div>
      </div>
      <div class="card" data-index="1" tabindex="0" role="button" aria-label="Details zu Kill Bill: The Whole Bloody Affair">
        <img src="https://image.tmdb.org/t/p/w500/iGv3RdpM6aK7KgTk8gUK9gDZEts.jpg" alt="" loading="lazy">
        <div class="info">
          <h2>Kill Bill: The Whole Bloody Affair</h2>
          <div class="meta">2026</div>
        </div>
      </div>
      <div class="card" data-index="2" tabindex="0" role="button" aria-label="Details zu Masters of the Universe">
        <img src="https://image.tmdb.org/t/p/w500/c4hwwylwgo5lBO2O2WSBxxQF2kC.jpg" alt="" loading="lazy">
        <div class="info">
          <h2>Masters of the Universe</h2>
          <div class="meta">2026</div>
        </div>
      </div>
      <div class="card" data-index="3" tabindex="0" role="button" aria-label="Details zu Shelter">
        <img src="https://image.tmdb.org/t/p/w500/fz8fhY5xuE6NenYDuBsHbB7wUdj.jpg" alt="" loading="lazy">
        <div class="info">
          <h2>Shelter</h2>
          <div class="meta">2026</div>
        </div>
      </div>
</div>
<div class="no-results" id="no-results">Keine Filme gefunden.</div>

<div class="overlay" id="overlay">
  <div class="detail">
    <button class="detail-close" id="detail-close" aria-label="Schließen">✕</button>
    <img id="detail-poster" alt="">
    <div class="detail-body">
      <h2 id="detail-title"></h2>
      <div class="detail-meta" id="detail-meta"></div>
      <div class="badges" id="detail-badges"></div>
      <p class="detail-overview" id="detail-overview"></p>
    </div>
  </div>
</div>

<script>
const MOVIES = [{"name": "Der Astronaut – Project Hail Mary", "year": 2026, "duration": "27.08.2026", "audio_labels": ["Science Fiction", "Abenteuer"], "overview": "Als Ryland Grace erwacht, muss er feststellen, dass er ganz allein ist. Er ist anscheinend der einzige Überlebende einer Raumfahrtmission, Millionen Kilometer von zu Hause entfernt, auf einem Flug ins Tau-Ceti-Sternsystem. Aber was erwartet ihn dort? Und warum sind alle anderen Besatzungsmitglieder tot? Nach und nach dämmert es Grace, dass von seinem Überleben nicht nur die Mission, sondern die Zukunft der gesamten Erdbevölkerung abhängt.", "poster": "https://image.tmdb.org/t/p/w500/qUraey7aJVaqx6NhlXl5Q7Z1rEX.jpg"}, {"name": "Kill Bill: The Whole Bloody Affair", "year": 2026, "duration": "05.11.2026", "audio_labels": ["Action", "Krimi", "Drama", "Thriller"], "overview": "Eine junge Frau, die abwechselnd „die Braut“, „Black Mamba“ oder „Kiddo“ genannt wird, ist Mitglied des von Bill geführten Attentatskommandos Tödliche Viper. Kiddo ist mit Bill liiert und wird von ihm schwanger, verschweigt es ihm aber. Sie will ihr Kind nicht in diesem Milieu aufwachsen lassen, kehrt daraufhin von einem Auftrag nicht zurück und lässt Bill in dem Glauben, sie sei getötet worden. In ihrem neuen Leben arbeitet sie in einem Plattenladen, dessen Inhaber sie heiraten will. Neun Monate später spürt das Attentatskommando sie jedoch auf und erschießt bei der Probe von Kiddos Hochzeit die versammelte Gesellschaft. Die hochschwangere Braut wird von Bill mit einem Kopfschuss lebensgefährlich verletzt und liegt vier Jahre auf einer Pflegestation im Koma. Als sie daraus erwacht, flüchtet sie aus dem Krankenhaus, stellt unter der Überschrift „Death List Five“ eine Todesliste (eng.: „kill bill“) auf und arbeitet sie schrittweise ab.", "poster": "https://image.tmdb.org/t/p/w500/iGv3RdpM6aK7KgTk8gUK9gDZEts.jpg"}, {"name": "Masters of the Universe", "year": 2026, "duration": "22.10.2026", "audio_labels": ["Action", "Fantasy", "Science Fiction"], "overview": "Nach 15 Jahren der Trennung führt das Schwert der Macht Prinz Adam zurück nach Eternia und entdeckt, dass seine Heimat unter der heimtückischen Herrschaft von Skeletor in Trümmern liegt. Um seine Familie und seine Welt zu retten, muss sich Adam mit seinen engsten Verbündeten zusammenschließen – Teela und Duncan alias Man-At-Arms – und sein wahres Schicksal als He-Man annehmen, den mächtigsten Mann des Universums.", "poster": "https://image.tmdb.org/t/p/w500/c4hwwylwgo5lBO2O2WSBxxQF2kC.jpg"}, {"name": "Shelter", "year": 2026, "duration": "07.08.2026", "audio_labels": ["Action", "Krimi", "Thriller"], "overview": "Der ehemalige Elite-Agent Michael Mason lebt auf einer schottischen Insel in völliger Isolation. Als eines Tages ein schwerer Sturm aufzieht und ein Boot kentert, rettet er ein Mädchen vor dem Ertrinken. Für den Bootsführer kommt jede Hilfe zu spät. Kurzerhand nimmt Michael Jessie bei sich auf und löst damit eine Kette unvorhergesehener Ereignisse aus: Sein Versteck wird entdeckt und von einem brutalen Squad-Team überfallen. Michael sieht sich gezwungen, seinen Zufluchtsort zu verlassen und in jene Welt zurückzukehren, der er für immer entkommen wollte. Um die Teenagerin in Sicherheit zu bringen, muss er sich den Dämonen seiner Vergangenheit stellen …", "poster": "https://image.tmdb.org/t/p/w500/fz8fhY5xuE6NenYDuBsHbB7wUdj.jpg"}];

function openDetail(i) {
  const m = MOVIES[i];
  if (!m) return;
  document.getElementById("detail-poster").src = m.poster || "";
  document.getElementById("detail-title").textContent = m.name;
  // "duration" traegt bei der Merkliste das volle Veroeffentlichungsdatum
  // (siehe library_publish._format_release_date()), das den Jahrgang schon
  // enthaelt -- getrennt nochmal m.year anzuhaengen waere redundant
  // ("2026 · 08.10.2026"), deshalb nur eins von beiden.
  document.getElementById("detail-meta").textContent = m.duration || m.year || "";
  document.getElementById("detail-badges").innerHTML =
    (m.audio_labels || []).map((a) => `<span class="badge">${a}</span>`).join("");
  document.getElementById("detail-overview").textContent = m.overview || "";
  document.getElementById("overlay").classList.add("open");
}

function closeDetail() {
  document.getElementById("overlay").classList.remove("open");
}

document.querySelector(".grid").addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (card) openDetail(Number(card.dataset.index));
});
document.querySelector(".grid").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const card = e.target.closest(".card");
  if (card) { e.preventDefault(); openDetail(Number(card.dataset.index)); }
});
document.getElementById("detail-close").addEventListener("click", closeDetail);
document.getElementById("overlay").addEventListener("click", (e) => {
  if (e.target.id === "overlay") closeDetail();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeDetail();
});

// Einfache Textsuche im Titel -- rein clientseitig, da alle Filmdaten
// (MOVIES) ohnehin schon fuers Detail-Overlay eingebettet sind, kein
// zusaetzlicher Request noetig. Blendet nicht passende Kacheln per
// Inline-style aus (bewusst NICHT das "hidden"-Attribut -- .card setzt
// selbst schon "display: flex", das gewinnt gegen die Browser-Standard-
// regel fuer [hidden]; eine ausgeblendete Karte waere trotzdem sichtbar
// geblieben, nur der Trefferzaehler haette gestimmt -- live so gefunden).
// Inline-style gewinnt garantiert gegen jede Stylesheet-Regel.
const searchInput = document.getElementById("search");
const cards = Array.from(document.querySelectorAll(".card"));
const totalCount = 4;

searchInput.addEventListener("input", () => {
  const query = searchInput.value.trim().toLowerCase();
  let visible = 0;
  cards.forEach((card) => {
    const name = (MOVIES[Number(card.dataset.index)]?.name || "").toLowerCase();
    const matches = !query || name.includes(query);
    card.style.display = matches ? "" : "none";
    if (matches) visible++;
  });
  document.getElementById("no-results").classList.toggle("show", visible === 0);
  document.getElementById("count").textContent = query
    ? `${visible} von ${totalCount} Filmen`
    : `${totalCount} gemerkte Filme · Stand: 02.10.2026 14:27`;
});
</script>
</body>
</html>
