<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Filmbibliothek</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { background: #0b0e14; color: #e6e9f0; font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 28px 16px; }
  h1 { text-align: center; font-size: 22px; margin: 0 0 4px; }
  .count { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
  .card { background: #12161f; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); }
  .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #1a2030; }
  .no-poster { width: 100%; aspect-ratio: 2/3; background: #1a2030; display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .info { padding: 9px 11px; }
  .info h2 { font-size: 13px; margin: 0 0 2px; font-weight: 600; line-height: 1.3; }
  .year { color: #94a3b8; font-size: 11.5px; }
</style>
</head>
<body>
<h1>Filmbibliothek</h1>
<div class="count">0 Filme &middot; Stand: 23.09.2026 11:48</div>
<div class="grid">

</div>
</body>
</html>
